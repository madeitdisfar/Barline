name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Windows only, and not merely because the tooling prefers it: the project
    # targets net10.0-windows and uses WPF and the WinRT media projections, none of
    # which build elsewhere.
    runs-on: windows-latest

    steps:
      # v5 for both: v4 runs on Node 20, which the runners now force onto Node 24
      # and warn about, and which stops being allowed in June 2026.
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Runs before a configuration is chosen, so it relies on RuntimeIdentifiers in
      # the project to fetch what the Release build below will ask for.
      - name: Restore
        run: dotnet restore

      # Warnings are worth failing on here. The project builds clean today, so any
      # new one is a regression rather than part of the background noise.
      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
