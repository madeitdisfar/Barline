name: Release

# Tag a commit and push the tag; everything below follows from that. Nothing is
# published without a further click: the GitHub release is created as a draft,
# and both builds are left as workflow artifacts.
#
# Neither build is attached to the release. The Store is the consumer channel, and
# the release page is the source drop that GitHub generates from the tag on its
# own. The portable zip is still built on every tag — it is how the publish path
# stays tested, and how a binary can be produced when one is wanted — but getting
# it means opening the workflow run rather than the release page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The project version is the one place a release number is written. If the
      # tag disagrees with it, the mistake is almost always a forgotten bump, and
      # it is far cheaper to fail here than to ship a binary that reports a
      # version nobody can find a tag for.
      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content src/Barline/Barline.csproj
          $version = $csproj.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          $tag = "${{ github.ref_name }}"

          Write-Host "project=$version tag=$tag"

          if ($tag -like 'v*' -and $tag -ne "v$version") {
            throw "Tag $tag does not match the project version $version. Bump <Version> in Barline.csproj, or retag."
          }

          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # A release that fails its own tests is worse than no release.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # ---- The portable build ----

      - name: Publish
        run: dotnet publish src/Barline/Barline.csproj -c Release -o artifacts/publish --nologo

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/publish/* `
                           -DestinationPath "artifacts/Barline-v$env:VERSION-win-x64.zip"

      - name: Upload the portable build
        uses: actions/upload-artifact@v4
        with:
          name: portable-win-x64
          path: artifacts/Barline-v${{ env.VERSION }}-win-x64.zip
          retention-days: 30

      # ---- The Store package ----

      # The same script used locally, so what CI produces and what you can
      # reproduce on your own machine cannot quietly diverge.
      - name: Build MSIX
        shell: pwsh
        run: ./packaging/Build-Package.ps1

      - name: Upload the Store package
        uses: actions/upload-artifact@v4
        with:
          name: msix-store-package
          path: artifacts/Barline.msix
          # Unsigned and useless to an end user, so it is deliberately not
          # attached to the public release. Download it here and upload it to
          # Partner Center, which does the signing.
          retention-days: 30

      # ---- The draft release ----

      # No assets. GitHub attaches the source archives to every release itself, and
      # those are the whole of what this page is now for.
      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --draft `
            --title "Barline ${{ github.ref_name }}" `
            --generate-notes
